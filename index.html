<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Proton Finance | Wealth Curator Dashboard</title>
    <meta name="description" content="Institutional-grade personal finance dashboard with AI-powered strategy insights, portfolio tracking, and budget intelligence." />

    <!-- Open Graph -->
    <meta property="og:title"       content="Proton Finance — Wealth Curator" />
    <meta property="og:description" content="AI-powered personal finance. Track net worth, spending, and execute AI-driven investment strategies." />
    <meta property="og:type"        content="website" />

    <!-- Google Analytics 4
         VITE_GA_MEASUREMENT_ID is substituted at build time by Vite.
         If the env var is absent the script src resolves to an invalid URL
         and is silently skipped; all gtagEvent calls no-op via the guard
         in src/utils/analytics.ts.                                         -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments) }
      gtag('js', new Date());
      // Only configure if the real gtag script loaded (not blocked by adblocker)
      if (typeof window.gtag === 'function') {
        gtag('config', '%VITE_GA_MEASUREMENT_ID%', { page_title: 'Proton Finance Dashboard' });
      }
    </script>

    <!-- Inter typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
